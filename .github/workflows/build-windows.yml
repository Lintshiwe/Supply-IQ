name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-electron/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install dependencies
        working-directory: desktop-electron
        run: bun install

      - name: Generate icons
        working-directory: desktop-electron
        run: python generate_icons.py

      - name: Build Windows NSIS installer
        working-directory: desktop-electron
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer to Release
        run: |
          echo "Looking for installer files:"
          Get-ChildItem -Path desktop-electron\dist-electron -Recurse -Filter "*.exe" | ForEach-Object { Write-Host "  $($_.FullName) ($($_.Length) bytes)" }
          $EXE = Get-ChildItem -Path desktop-electron\dist-electron -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($EXE) {
            Write-Host "Uploading: $($EXE.Name)"
            gh release upload v1.0.5 $EXE.FullName --clobber --repo Lintshiwe/Supply-IQ
            # Also delete old zip if present
            gh release delete-asset v1.0.5 SupplyIQ-1.0.5-win.zip --yes --repo Lintshiwe/Supply-IQ 2>$null
          } else {
            Write-Host "No .exe found!"
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
