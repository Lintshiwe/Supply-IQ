name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop-electron/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install dependencies
        working-directory: desktop-electron
        run: bun install

      - name: Generate icons
        working-directory: desktop-electron
        run: python generate_icons.py

      - name: Build Windows NSIS installer
        working-directory: desktop-electron
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer to Release
        run: |
          $EXE = Get-ChildItem -Path desktop-electron\dist-electron -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "*Setup*" } | Select-Object -First 1
          if (-not $EXE) { $EXE = Get-ChildItem -Path desktop-electron\dist-electron -Recurse -Filter "*.exe" | Select-Object -First 1 }
          if ($EXE) {
            Write-Host "Uploading: $($EXE.Name) ($($EXE.Length) bytes)"
            gh release upload v1.0.5 "$($EXE.FullName)" --clobber --repo Lintshiwe/Supply-IQ
          } else {
            Write-Host "No .exe found!"
            Get-ChildItem -Path desktop-electron\dist-electron -Recurse
            exit 1
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
