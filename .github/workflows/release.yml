name: Build and Release SupplyIQ Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ─── Linux AppImage ─────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build backend
        run: bun run --cwd backend build

      - name: Build AppImage
        run: |
          cd desktop
          bunx tauri build --bundles appimage
          cd ..

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: supplyiq-linux
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  # ─── Windows .exe ───────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build backend
        run: bun run --cwd backend build

      - name: Build Windows installer
        run: |
          cd desktop
          bunx tauri build --bundles msi
          cd ..

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: supplyiq-windows
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  # ─── macOS .dmg ─────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build backend
        run: bun run --cwd backend build

      - name: Build macOS DMG
        run: |
          cd desktop
          bunx tauri build --bundles dmg
          cd ..

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: supplyiq-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # ─── Create Release ─────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { name: supplyiq-linux, path: ./linux }
      
      - uses: actions/download-artifact@v4
        with: { name: supplyiq-windows, path: ./windows }
      
      - uses: actions/download-artifact@v4
        with: { name: supplyiq-macos, path: ./macos }

      - name: Rename artifacts
        run: |
          mkdir -p release
          find ./linux -name "*.AppImage" -exec cp {} ./release/SupplyIQ-linux-x86_64.AppImage \;
          find ./windows -name "*.msi" -exec cp {} ./release/SupplyIQ-windows-x86_64.msi \;
          find ./macos -name "*.dmg" -exec cp {} ./release/SupplyIQ-macos-arm64.dmg \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SupplyIQ Desktop ${{ github.ref_name }}"
          body: |
            ## SupplyIQ Desktop ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |---|---|
            | Windows | `SupplyIQ-windows-x86_64.msi` |
            | macOS | `SupplyIQ-macos-arm64.dmg` |
            | Linux | `SupplyIQ-linux-x86_64.AppImage` |

            ### Install
            - **Windows**: Double-click the `.msi` installer
            - **macOS**: Open the `.dmg` and drag to Applications
            - **Linux**: `chmod +x SupplyIQ-linux-x86_64.AppImage && ./SupplyIQ-linux-x86_64.AppImage`

            ### System Requirements
            - Windows 10/11 (64-bit)
            - macOS 12+ (Apple Silicon & Intel)
            - Ubuntu 22.04+ (or equivalent)
          files: release/**
          generate_release_notes: true
