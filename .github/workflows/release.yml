name: Build and Release SupplyIQ Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Generate icons
        run: cd desktop/src-tauri && python3 generate_icons.py

      - name: Build Tauri AppImage
        run: cd desktop && bunx tauri build --bundles appimage

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: supplyiq-linux
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Generate icons
        run: cd desktop\src-tauri && python generate_icons.py

      - name: Build Tauri MSI
        run: cd desktop && bunx tauri build --bundles msi

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: supplyiq-windows
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install

      - name: Generate icons
        run: cd desktop/src-tauri && python3 generate_icons.py

      - name: Build Tauri DMG
        run: cd desktop && bunx tauri build --bundles dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: supplyiq-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { name: supplyiq-linux, path: ./release/linux }
      
      - uses: actions/download-artifact@v4
        with: { name: supplyiq-windows, path: ./release/windows }
      
      - uses: actions/download-artifact@v4
        with: { name: supplyiq-macos, path: ./release/macos }

      - name: Organize release files
        run: |
          mkdir -p dist
          find ./release/linux -name "*.AppImage" -exec mv {} ./dist/SupplyIQ-linux-x86_64.AppImage \; 2>/dev/null || echo "No Linux build"
          find ./release/windows -name "*.msi" -exec mv {} ./dist/SupplyIQ-windows-x86_64.msi \; 2>/dev/null || echo "No Windows build"
          find ./release/macos -name "*.dmg" -exec mv {} ./dist/SupplyIQ-macos-arm64.dmg \; 2>/dev/null || echo "No macOS build"
          ls -la dist/ || echo "No files in dist"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SupplyIQ Desktop ${{ github.ref_name }}"
          body: |
            ## SupplyIQ Desktop ${{ github.ref_name }}

            ### Download
            | Platform | File |
            |---|---|
            | 🪟 Windows | `SupplyIQ-windows-x86_64.msi` |
            | 🍎 macOS | `SupplyIQ-macos-arm64.dmg` |
            | 🐧 Linux | `SupplyIQ-linux-x86_64.AppImage` |

            ### Install
            - **Windows**: Double-click the `.msi` installer
            - **macOS**: Open `.dmg` and drag to Applications (may need to allow in Security & Privacy)
            - **Linux**: `chmod +x SupplyIQ-linux-x86_64.AppImage && ./SupplyIQ-linux-x86_64.AppImage`

            ### System Requirements
            - Windows 10/11 (64-bit)
            - macOS 12+ (Apple Silicon & Intel)
            - Ubuntu 22.04+ or equivalent Linux
          files: dist/*
          generate_release_notes: true
