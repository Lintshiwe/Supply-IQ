<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SupplyIQ Barcode Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.card{background:#1e293b;border-radius:16px;padding:20px;width:100%;max-width:400px;text-align:center;box-shadow:0 25px 50px rgba(0,0,0,.4)}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:12px;color:#64748b;margin-bottom:16px}
#reader{width:100%;max-width:400px;border-radius:12px;overflow:hidden;margin-bottom:12px}
#reader video{border-radius:12px}
.btn{width:100%;padding:14px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:8px;transition:opacity .2s}
.btn-start{background:#84cc16;color:#0f172a}
.btn-stop{background:#334155;color:#e2e8f0}
.btn-stop:hover,.btn-start:hover{opacity:.9}
.result-card{background:#1e293b;border-radius:12px;padding:16px;margin-top:12px;text-align:center}
.result-card h2{font-size:16px;font-weight:600;margin-bottom:2px}
.result-card .sku{font-family:monospace;font-size:12px;color:#94a3b8;margin-bottom:8px}
.result-card .barcode{font-family:monospace;font-size:11px;color:#64748b;margin-bottom:12px}
.stock-badge{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:13px;font-weight:600}
.in-stock{background:#065f46;color:#6ee7b7}
.low-stock{background:#78350f;color:#fbbf24}
.out-stock{background:#7f1d1d;color:#fca5a5}
.manual{border-top:1px solid #334155;margin-top:16px;padding-top:16px}
.manual input{width:100%;padding:12px;border-radius:10px;border:2px solid #334155;background:#0f172a;color:#e2e8f0;font-size:16px;text-align:center;font-family:monospace;outline:none;margin-bottom:8px}
.manual input:focus{border-color:#84cc16}
.error{background:#7f1d1d;border-radius:10px;padding:12px;margin-top:8px;text-align:center}
.error p{font-size:13px;color:#fca5a5}
.scan-count{font-size:11px;color:#64748b;margin-top:4px}
</style>
</head>
<body>

<div class="card">
  <h1>📦 SupplyIQ Scanner</h1>
  <p class="sub">Point camera at a barcode to scan</p>

  <div id="reader"></div>

  <button class="btn btn-start" id="startBtn" onclick="startScanner()">Start Scanner</button>
  <button class="btn btn-stop" id="stopBtn" onclick="stopScanner()" style="display:none">Stop Scanner</button>
  <p class="scan-count" id="scanCount"></p>

  <div id="scanResult"></div>

  <div class="manual">
    <p style="font-size:12px;color:#64748b;margin-bottom:8px">Or type a barcode manually</p>
    <input type="text" id="manualInput" placeholder="Type barcode or SKU..." autocomplete="off">
    <button class="btn btn-start" onclick="manualLookup()" style="width:100%">Look Up</button>
  </div>
</div>

<script>
let html5QrCode = null;
let isScanning = false;
const API = '/api/scan';
let scanCount = 0;

function startScanner() {
  if (isScanning) return;

  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'block';
  document.getElementById('scanResult').innerHTML = '';

  html5QrCode = new Html5Qrcode("reader");
  const config = {
    fps: 10,
    qrbox: { width: 300, height: 120 },
    aspectRatio: 1.0,
  };

  html5QrCode.start(
    { facingMode: "environment" },
    config,
    onScanSuccess,
    onScanFailure
  ).then(() => {
    isScanning = true;
  }).catch(err => {
    document.getElementById('scanResult').innerHTML =
      `<div class="error"><p>Camera error: ${err}. Try manual lookup below.</p></div>`;
    stopScanner();
  });
}

function stopScanner() {
  if (html5QrCode && isScanning) {
    html5QrCode.stop().then(() => {
      html5QrCode.clear();
      isScanning = false;
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';
    }).catch(() => {});
  }
}

function onScanSuccess(decodedText) {
  // Prevent duplicate scans within 2 seconds
  const now = Date.now();
  if (window._lastScan && now - window._lastScan < 2000) return;
  window._lastScan = now;
  scanCount++;
  document.getElementById('scanCount').textContent = `Scanned: ${scanCount}`;
  lookup(decodedText);
}

function onScanFailure() {
  // Scanner couldn't find a barcode in this frame — normal, ignore
}

async function lookup(barcode) {
  const resultDiv = document.getElementById('scanResult');
  resultDiv.innerHTML = '<p style="color:#94a3b8;padding:12px">Looking up ' + barcode + '...</p>';

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);

  try {
    const res = await fetch(`${API}?barcode=${encodeURIComponent(barcode)}`, {
      signal: controller.signal
    });
    clearTimeout(timeout);
    const data = await res.json();

    if (!res.ok) {
      resultDiv.innerHTML = `<div class="error">
        <p>Not Found: <strong>${barcode}</strong></p>
        <p style="font-size:11px;margin-top:4px">Import items to the catalog first, then try again.</p>
      </div>`;
    } else {
      let cls = data.stock === 0 ? 'out-stock' : data.stock <= 10 ? 'low-stock' : 'in-stock';
      let label = data.stock === 0 ? 'Out of Stock' : data.stock <= 10 ? 'Low Stock' : 'In Stock';
      resultDiv.innerHTML = `<div class="result-card">
        <div class="barcode">${data.barcode || barcode}</div>
        <h2>${data.name}</h2>
        <div class="sku">SKU: ${data.sku}</div>
        <div class="stock-badge ${cls}">${label}: ${data.stock} ${data.unit || 'ea'}</div>
      </div>`;
    }
  } catch (e) {
    clearTimeout(timeout);
    if (e.name === 'AbortError') {
      resultDiv.innerHTML = `<div class="error">
        <p>Server timeout — waking up...</p>
        <p style="font-size:11px;margin-top:4px">Free server sleeps when idle. Try again in 10 seconds.</p>
        <button class="btn btn-start" style="margin-top:8px" onclick="lookup('${barcode}')">Retry</button>
      </div>`;
    } else {
      resultDiv.innerHTML = `<div class="error">
        <p>Connection failed — server is starting up</p>
        <p style="font-size:11px;margin-top:4px">First request wakes the server (~30s). Try again.</p>
        <button class="btn btn-start" style="margin-top:8px" onclick="lookup('${barcode}')">Retry</button>
      </div>`;
      // Wake up the server by hitting the root
      fetch('/', { signal: AbortSignal.timeout(3000) }).catch(() => {});
    }
  }
}

function manualLookup() {
  const val = document.getElementById('manualInput').value.trim();
  if (!val) return;
  lookup(val);
}

document.getElementById('manualInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') manualLookup();
});

// Auto-lookup from URL param
const params = new URLSearchParams(window.location.search);
const bc = params.get('barcode');
if (bc) {
  document.getElementById('manualInput').value = bc;
  lookup(bc);
}

// Wake up server on page load (free tier cold start)
window.addEventListener('load', () => {
  fetch('/api/scan?barcode=wakeup', { signal: AbortSignal.timeout(5000) })
    .then(() => document.getElementById('scanCount').textContent = 'Server ready')
    .catch(() => document.getElementById('scanCount').textContent = 'Waking server...');
});
</script>
</body>
</html>
