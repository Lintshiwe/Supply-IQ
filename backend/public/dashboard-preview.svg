<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <!-- Main container -->
  <rect width="960" height="540" fill="#f8fafc"/>
  
  <!-- Sidebar -->
  <rect x="0" y="0" width="200" height="540" fill="#0f172a"/>
  <!-- Sidebar logo -->
  <rect x="16" y="16" width="24" height="24" rx="4" fill="#84cc16"/>
  <text x="48" y="33" font-family="sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">Supply</text>
  <text x="92" y="33" font-family="sans-serif" font-size="14" font-weight="700" fill="#84cc16">IQ</text>
  
  <!-- Sidebar nav items -->
  <rect x="8" y="60" width="184" height="28" rx="6" fill="#1e293b"/>
  <text x="40" y="79" font-family="sans-serif" font-size="11" fill="#e2e8f0">≡ Operations</text>
  
  <rect x="12" y="94" width="176" height="24" rx="4" fill="#1e293b"/>
  <text x="36" y="110" font-family="sans-serif" font-size="10" fill="#84cc16">■ Dashboard</text>
  
  <text x="36" y="134" font-family="sans-serif" font-size="10" fill="#64748b">□ Catalog</text>
  <text x="36" y="154" font-family="sans-serif" font-size="10" fill="#64748b">□ Movements</text>
  <text x="36" y="174" font-family="sans-serif" font-size="10" fill="#64748b">□ Locations</text>
  
  <rect x="8" y="194" width="184" height="28" rx="6" fill="#0f172a"/>
  <text x="40" y="213" font-family="sans-serif" font-size="11" fill="#64748b">≡ Procurement</text>
  
  <rect x="8" y="230" width="184" height="28" rx="6" fill="#0f172a"/>
  <text x="40" y="249" font-family="sans-serif" font-size="11" fill="#64748b">≡ Intelligence</text>
  
  <rect x="8" y="266" width="184" height="28" rx="6" fill="#0f172a"/>
  <text x="40" y="285" font-family="sans-serif" font-size="11" fill="#64748b">≡ Admin</text>
  
  <line x1="12" y1="300" x2="188" y2="300" stroke="#1e293b" stroke-width="1"/>
  <text x="36" y="320" font-family="sans-serif" font-size="10" fill="#64748b">□ Requests</text>
  <text x="36" y="340" font-family="sans-serif" font-size="10" fill="#64748b">□ Help</text>

  <!-- Header -->
  <rect x="200" y="0" width="760" height="44" fill="#fff" stroke="#e2e8f0" stroke-width="0 0 1 0"/>
  <rect x="216" y="8" width="300" height="28" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="240" y="26" font-family="sans-serif" font-size="11" fill="#94a3b8">Search…</text>
  <text x="500" y="26" font-family="monospace" font-size="10" fill="#cbd5e1">⌘K</text>
  
  <!-- Header right -->
  <circle cx="524" cy="22" r="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="556" cy="22" r="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="588" cy="22" r="10" fill="#fef9c3" stroke="#eab308" stroke-width="1"/>
  <text x="588" y="26" font-family="sans-serif" font-size="9" fill="#eab308" text-anchor="middle">3</text>
  <circle cx="618" cy="22" r="12" fill="#f1f5f9"/>
  <text x="618" y="27" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="middle">D</text>

  <!-- Main content area -->
  <rect x="216" y="56" width="728" height="466"/>
  
  <!-- Page title -->
  <text x="216" y="76" font-family="sans-serif" font-size="18" font-weight="700" fill="#0f172a">Dashboard</text>
  <text x="216" y="94" font-family="sans-serif" font-size="11" fill="#64748b">Welcome back — here's your inventory overview.</text>

  <!-- Metric Cards -->
  <g transform="translate(216, 106)">
    <rect x="0" y="0" width="172" height="68" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#64748b">Total SKUs</text>
    <text x="14" y="48" font-family="monospace" font-size="22" font-weight="700" fill="#0f172a">256</text>
    <circle cx="142" cy="34" r="14" fill="#1e293b"/>
    <text x="142" y="39" font-family="sans-serif" font-size="11" fill="#fff" text-anchor="middle">P</text>
  </g>
  <g transform="translate(396, 106)">
    <rect x="0" y="0" width="172" height="68" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#64748b">In Stock</text>
    <text x="14" y="48" font-family="monospace" font-size="22" font-weight="700" fill="#16a34a">189</text>
    <circle cx="142" cy="34" r="14" fill="#dcfce7"/>
    <text x="142" y="39" font-family="sans-serif" font-size="11" fill="#16a34a" text-anchor="middle">✓</text>
  </g>
  <g transform="translate(576, 106)">
    <rect x="0" y="0" width="172" height="68" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#64748b">Low Stock</text>
    <text x="14" y="48" font-family="monospace" font-size="22" font-weight="700" fill="#ca8a04">12</text>
    <circle cx="142" cy="34" r="14" fill="#fef9c3"/>
    <text x="142" y="39" font-family="sans-serif" font-size="11" fill="#ca8a04" text-anchor="middle">!</text>
  </g>
  <g transform="translate(756, 106)">
    <rect x="0" y="0" width="172" height="68" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#64748b">Out of Stock</text>
    <text x="14" y="48" font-family="monospace" font-size="22" font-weight="700" fill="#dc2626">5</text>
    <circle cx="142" cy="34" r="14" fill="#fee2e2"/>
    <text x="142" y="39" font-family="sans-serif" font-size="11" fill="#dc2626" text-anchor="middle">✕</text>
  </g>

  <!-- Needs Attention + Activity -->
  <g transform="translate(216, 184)">
    <!-- Needs Attention card -->
    <rect x="0" y="0" width="440" height="150" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">Needs Attention</text>
    <!-- Items -->
    <rect x="14" y="36" width="412" height="24" rx="4" fill="#fff7ed"/>
    <text x="24" y="52" font-family="sans-serif" font-size="9" fill="#c2410c">⚠ Sticky Notes — Out of Stock (0 remaining)</text>
    <rect x="14" y="64" width="412" height="24" rx="4" fill="#fefce8"/>
    <text x="24" y="80" font-family="sans-serif" font-size="9" fill="#ca8a04">⚠ Blue Pens Box — Low Stock (5 remaining)</text>
    <rect x="14" y="92" width="412" height="24" rx="4" fill="#f0f9ff"/>
    <text x="24" y="108" font-family="sans-serif" font-size="9" fill="#0369a1">ℹ PO-2024-001 — Overdue (2 days)</text>
    <rect x="14" y="120" width="412" height="24" rx="4" fill="#faf5ff"/>
    <text x="24" y="136" font-family="sans-serif" font-size="9" fill="#7e22ce">ℹ REQ-001 — Pending Approval</text>
  </g>
  
  <!-- Recent Activity -->
  <g transform="translate(668, 184)">
    <rect x="0" y="0" width="260" height="150" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">Recent Activity</text>
    <text x="14" y="46" font-family="sans-serif" font-size="9" fill="#64748b">USB-C Cable received +150 · 2h ago</text>
    <text x="14" y="64" font-family="sans-serif" font-size="9" fill="#64748b">PO-2024-001 approved · 4h ago</text>
    <text x="14" y="82" font-family="sans-serif" font-size="9" fill="#64748b">Wireless Mouse shipped -5 · 6h ago</text>
    <text x="14" y="100" font-family="sans-serif" font-size="9" fill="#64748b">Safety Glasses alert triggered · 8h ago</text>
    <text x="14" y="118" font-family="sans-serif" font-size="9" fill="#64748b">Desk Organizer reorder suggested</text>
    <text x="14" y="136" font-family="sans-serif" font-size="9" fill="#64748b">New item: Power Bank added · 12h ago</text>
  </g>

  <!-- Chart Section -->
  <g transform="translate(216, 342)">
    <rect x="0" y="0" width="712" height="170" rx="8" fill="#fff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="14" y="24" font-family="sans-serif" font-size="12" font-weight="600" fill="#0f172a">Stock Levels — 30 Day Trend</text>
    <!-- Chart bars -->
    <g transform="translate(20, 40)">
      <rect x="0" y="90" width="18" height="30" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="26" y="75" width="18" height="45" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="52" y="85" width="18" height="35" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="78" y="60" width="18" height="60" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="104" y="80" width="18" height="40" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="130" y="95" width="18" height="25" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="156" y="65" width="18" height="55" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="182" y="85" width="18" height="35" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="208" y="70" width="18" height="50" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="234" y="80" width="18" height="40" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="260" y="55" width="18" height="65" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="286" y="75" width="18" height="45" rx="2" fill="#84cc16" opacity="0.7"/>
      <rect x="312" y="90" width="18" height="30" rx="2" fill="#84cc16" opacity="0.7"/>
      <!-- Trend line -->
      <polyline points="9,60 35,55 61,70 87,50 113,65 139,85 165,55 191,75 217,60 243,70 269,45 295,65 321,80" fill="none" stroke="#0f172a" stroke-width="2"/>
      <!-- Labels -->
      <text x="0" y="118" font-family="sans-serif" font-size="7" fill="#94a3b8">Apr 5</text>
      <text x="100" y="118" font-family="sans-serif" font-size="7" fill="#94a3b8">Apr 15</text>
      <text x="200" y="118" font-family="sans-serif" font-size="7" fill="#94a3b8">Apr 25</text>
      <text x="300" y="118" font-family="sans-serif" font-size="7" fill="#94a3b8">May 5</text>
    </g>
  </g>
</svg>
