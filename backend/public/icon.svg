<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>
  <!-- Box outline -->
  <g transform="translate(8, 6)">
    <rect x="2" y="10" width="28" height="26" rx="4" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Box top -->
    <rect x="6" y="4" width="28" height="10" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
    <!-- Up arrow inside box -->
    <path d="M16 24 L16 16 M12 19 L16 15 L20 19" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- Green IQ text -->
  <text x="36" y="38" font-family="'Inter', 'Geist Sans', -apple-system, sans-serif" font-size="8" font-weight="800" fill="#84cc16" text-anchor="end">IQ</text>
</svg>
