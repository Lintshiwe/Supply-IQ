services:
  - type: web
    name: supplyiq-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npx vite preview --port $PORT --host 0.0.0.0
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: sladethedeciever@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
    healthCheckPath: /api/health

databases:
  - name: supplyiq-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
