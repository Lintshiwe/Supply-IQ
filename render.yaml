services:
  - type: web
    name: supplyiq-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && npm install --legacy-peer-deps && npm run build
    startCommand: cd backend && NODE_OPTIONS="--no-deprecation" node node_modules/vite/bin/vite.js dev --port $PORT --host 0.0.0.0
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: sladethedeciever@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: supplyiq-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
