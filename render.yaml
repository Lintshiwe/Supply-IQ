services:
  - type: web
    name: supplyiq-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd backend && bun install && bun run build
    startCommand: cd backend && PORT=$PORT NODE_OPTIONS="--no-deprecation" bun run vite dev --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: sladethedeciever@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: supplyiq-db
    plan: free
    region: frankfurt
    postgresMajorVersion: 16
