[build]
  base = "backend"
  command = "bun install && bun run build"
  publish = "dist/client"

[build.environment]
  VITE_API_URL = "https://supplyiq-api.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://supplyiq-api.onrender.com/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
