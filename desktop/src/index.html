<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyIQ</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .loader { text-align: center; color: #e2e8f0; }
    .loader svg { width: 64px; height: 64px; margin: 0 auto 16px; display: block; }
    .loader h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .loader h1 span { color: #84cc16; }
    .loader p { font-size: 14px; color: #94a3b8; }
    .spinner {
      width: 24px; height: 24px;
      border: 3px solid #334155;
      border-top-color: #84cc16;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 24px auto 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#a3e635"/>
          <stop offset="100%" stop-color="#65a30d"/>
        </linearGradient>
      </defs>
      <g transform="translate(8,6)">
        <rect x="2" y="10" width="28" height="26" rx="4" fill="none" stroke="#475569" stroke-width="1.5"/>
        <rect x="6" y="4" width="28" height="10" rx="2" fill="none" stroke="#475569" stroke-width="1.5"/>
        <path d="M16 24 L16 16 M12 19 L16 15 L20 19" stroke="#84cc16" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
      <text x="36" y="38" font-family="sans-serif" font-size="8" font-weight="800" fill="#84cc16" text-anchor="end">IQ</text>
    </svg>
    <h1>Supply<span>IQ</span></h1>
    <p>Loading your inventory command center...</p>
    <div class="spinner"></div>
  </div>
  <script>
    // Open the web app or local dev server
    const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const targetUrl = isDev ? 'http://localhost:8080/app/dashboard' : 'https://app.supplyiq.co.za/app/dashboard';
    window.location.href = targetUrl;
  </script>
</body>
</html>
