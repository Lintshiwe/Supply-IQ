version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: supplyiq-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: supplyiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supplyiq"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supplyiq-backend
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/supplyiq
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: sladethedeciever@gmail.com
      SMTP_PASS: "rxtt zokl eurm ojti"
      SESSION_SECRET: supplyiq-production-secret-key
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
